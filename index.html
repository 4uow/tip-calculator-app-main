<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Tip calculator app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <!-- 预连接，提高字体加载速度 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 引入 Space Mono 700字重 -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

   <script src="script.js" defer></script>
</head>
<body>
  <div class="logo">
    <img src="images/logo.svg" alt="splitter" class="splitter">
  </div>
  <main>
    <form id="tip-form">
      <div class="form-fields">
        <div>
          <label for="bill" class="title">Bill</label>
          <div class="input-wrapper">
            <img src="images/icon-dollar.svg" alt="">
            <input type="number" id="bill" placeholder="0" min="0" step="0.01" required aria-label="Enter bill amount">
          </div>
        </div>
        <fieldset>
          <legend class="title"> Select Tip %</legend>
          <div class="tip-options">
            <label for="tip-5">
              <input type="radio" name="tip" value="5" id="tip-5" aria-label="5% tip">
              <span>5%</span>
            </label>
            <label for="tip-10">
              <input type="radio" name="tip" value="10" id="tip-10"
              aria-label="10% tip">
              <span>10%</span>
            </label>
            <label for="tip-15">
              <input type="radio" name="tip" value="15" id="tip-15"
              aria-label="15% tip">
              <span>15%</span>
            </label>
            <label for="tip-25">
              <input type="radio" name="tip" value="25" id="tip-25"
              aria-label="25% tip">
              <span>25%</span>
            </label>
            <label for="tip-50">
              <input type="radio" name="tip" value="50" id="tip-50"
              aria-label="50% tip">
              <span>50%</span>
            </label>
            <input type="number" name="tip" min="0" step="0.01" placeholder="Custom" id="tip-custom" aria-label="Custom tip percentage">
          </div>
          
          </fieldset>
        
          <div>
            <label for="number-of-people" class="title">Number of People</label>
            <div class="input-wrapper">
              <img src="images/icon-person.svg" alt="">
              <input type="number" id="number-of-people" placeholder="0" min="1" required aria-label="amount of people">
            </div>
          </div>
        
      </div>
      
      <section class="results" aria-label="Calculation results">
        <div class = "result-row">
          <p>
            Tip Amount
            <span class="light-font">/ person</span>
          </p>
          <output id="tip-amount">$0.00</output>
        </div>
        <div class="result-row">
          <p>
            Total
            <span class="light-font">/ person</span>
          </p>
          <output id="total">$0.00</output>
        </div>
        <button id="reset" type="reset">RESET</button>
      </section>
    </form>
  </main>
  
  <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</body>
</html>
